
apiVersion: v1
kind: Service
metadata:
  name: fogfoga0-mongo
  namespace: simulateiot
spec:
  type: ClusterIP
  selector:
    app: fogfoga0-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fogfoga0-mongo
  namespace: simulateiot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fogfoga0-mongo
  template:
    metadata:
      labels:
        app: fogfoga0-mongo
    spec:
      nodeSelector:
        simulateiot.io/role: host
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: mongo
          image: mongo:6
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongo
              containerPort: 27017

