apiVersion: apps/v1
kind: Deployment
metadata:
  name: fogfoga0-sensor-sensa0
  namespace: simulateiot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fogfoga0-sensor-sensa0
  template:
    metadata:
      labels:
        app: fogfoga0-sensor-sensa0
    spec:
      nodeSelector:
        simulateiot.io/role: host
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: sensor
          image: 192.168.0.17:5000/sensor-sensa0:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MQTT_BROKER_URI
              value: tcp://mosquitto-foga0:1883
            - name: MQTT_TOPIC
              value: C
            - name: MQTT_CLIENT_ID_PREFIX
              value: sensa0
            - name: PUBLISH_COUNT
              value: "99999"
            - name: PUBLISH_INTERVAL_MS
              value: "1000.0"
            - name: SENSOR_QUANTITY
              value: "1"
